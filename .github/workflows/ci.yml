name: ci
on:
  push:
  pull_request:
jobs:
  abcc-data-recovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/abcc-data-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q
  quebec-property-extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/quebec-property-extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
